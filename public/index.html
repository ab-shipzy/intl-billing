<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShipzyCart · My Shipments</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#0074ff;--navy:#00304a;--mint:#43edd4;--bg:#f4f7fb;--line:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:#1e293b;font-size:14px}
.mono{font-family:'JetBrains Mono',monospace}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center}
header h1{font-size:16px;font-weight:800}
header h1 span{color:var(--mint)}
header .right{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:13px}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;font-size:13px}
.btn.ghost{background:transparent;border:1px solid #28506b;color:#9fb3c8}
main{padding:20px 24px;max-width:1200px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--navy)}
.stat .l{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;background:#f8fafc;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #f1f5f9}
tr.row:hover{background:#f0f7ff;cursor:pointer}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:#e0edff;color:var(--blue)}
.tag.mint{background:#d9fbf4;color:#0b7d6d}
.tag.gray{background:#f1f5f9;color:#64748b}
.amt{font-family:'JetBrains Mono',monospace;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,20,35,.5);display:none;z-index:50}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:-560px;width:min(560px,95vw);height:100vh;background:#fff;z-index:60;box-shadow:-8px 0 30px rgba(0,0,0,.15);transition:right .25s;overflow:auto;padding:22px}
.drawer.open{right:0}
h2{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:14px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);margin:18px 0 8px;font-weight:700}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:#64748b}.kv dd{font-weight:600}
.doc{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}
.doc a{color:var(--blue);text-decoration:none;font-weight:600;flex:1}
label{display:block;font-size:11px;font-weight:600;color:#64748b;margin-bottom:3px}
input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px}
#loginView{max-width:360px;margin:14vh auto;padding:0 16px}
.grid{display:grid;gap:10px}
.hide{display:none!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:10px;display:none;z-index:99;font-size:13px}
#splash{position:fixed;inset:0;background:var(--navy);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;opacity:1;transition:opacity .5s}
#splash.show{display:flex}
#splash.fade{opacity:0}
#splash .logo{font-size:26px;font-weight:800;color:#fff}
#splash .logo span{color:var(--mint)}
#splash .wel{font-size:18px;color:#cfe3ff;font-weight:600}
#splash .wel b{color:var(--mint)}
#splash .bar{width:120px;height:3px;background:#28506b;border-radius:3px;overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;background:var(--blue);animation:fill 1.4s ease forwards}
@keyframes fill{to{width:100%}}
</style>
</head>
<body>

<div id="loginView">
  <div class="card">
    <h2>Shipzy<span style="color:var(--blue)">Cart</span> · Customer Portal</h2>
    <p style="color:#64748b;font-size:13px;margin-bottom:12px">Track your international shipment billing</p>
    <div class="grid">
      <div><label>Customer Code</label><input id="lc" class="mono" placeholder="e.g. SZC-ACME" autocapitalize="characters"></div>
      <div><label>Password</label><input id="lp" type="password"></div>
      <button class="btn" onclick="doLogin()">Login</button>
    </div>
  </div>
</div>

<div id="appView" class="hide">
<header>
  <h1>Shipzy<span>Cart</span></h1>
  <div class="right">
    <span id="who" class="mono"></span>
    <button class="btn ghost" onclick="logout()">Logout</button>
  </div>
</header>
<main>
  <div class="stats">
    <div class="stat"><div class="v" id="st_count">0</div><div class="l">Shipments</div></div>
    <div class="stat"><div class="v" id="st_weight">0</div><div class="l">Total Chg. Wt (kg)</div></div>
    <div class="stat"><div class="v" id="st_amount">₹0</div><div class="l">Total Billed</div></div>
  </div>
  <div class="card" style="padding:0;overflow:auto">
    <table>
      <thead><tr><th>Date</th><th>AWB</th><th>Carrier</th><th>From</th><th>To</th><th>Boxes</th><th>Weight (kg)</th><th>Rate</th><th>Amount ₹</th><th>Status</th></tr></thead>
      <tbody id="shipBody"></tbody>
    </table>
  </div>
</main>
</div>

<div class="overlay" id="ov" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2 id="d_title">Shipment</h2>
    <button class="btn ghost" style="color:#334155;border-color:var(--line)" onclick="closeDrawer()">✕</button>
  </div>
  <div id="d_body"></div>
  <h3>Documents</h3>
  <div id="d_docs"></div>
</div>

<div id="toast"></div>
<div id="splash">
  <div class="logo">Shipzy<span>Cart</span></div>
  <div class="wel">Welcome, <b id="splashName"></b> 👋</div>
  <div class="bar"><i></i></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
async function api(url,opts={}){
  const r=await fetch(url,{headers:opts.body?{'Content-Type':'application/json'}:{},...opts,body:opts.body?JSON.stringify(opts.body):undefined});
  if(r.status===401){$('appView').classList.add('hide');$('loginView').classList.remove('hide');throw new Error('auth');}
  const j=await r.json();
  if(!r.ok)throw new Error(j.error||'error');
  return j;
}
async function doLogin(){
  try{
    const r=await api('/api/login',{method:'POST',body:{role:'customer',code:$('lc').value,password:$('lp').value}});
    showSplash(r.name||r.code);
    setTimeout(boot,1500);
  }catch(e){toast(e.message);}
}
function showSplash(name){
  $('splashName').textContent=name;
  const sp=$('splash');
  sp.classList.add('show');sp.classList.remove('fade');
  setTimeout(()=>sp.classList.add('fade'),1600);
  setTimeout(()=>sp.classList.remove('show'),2150);
}
async function logout(){await api('/api/logout',{method:'POST'});location.reload();}
$('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

async function boot(){
  try{
    const me=await api('/api/me');
    if(me.role!=='customer'){$('loginView').classList.remove('hide');return;}
    $('who').textContent=me.code+' · '+me.name;
    $('loginView').classList.add('hide');$('appView').classList.remove('hide');
    const rows=await api('/api/my/shipments');
    $('st_count').textContent=rows.length;
    $('st_weight').textContent=fmt(rows.reduce((a,s)=>a+(s.chargeable_weight||0),0));
    $('st_amount').textContent='₹'+fmt(rows.reduce((a,s)=>a+(s.amount||0),0));
    $('shipBody').innerHTML=rows.map(s=>`<tr class="row" onclick="openDrawer(${s.id})">
      <td>${esc(s.ship_date)}</td><td class="mono"><b>${esc(s.awb)}</b></td>
      <td>${esc(s.provider)}</td>
      <td>${esc(s.from_country)}${s.from_pincode?' · '+esc(s.from_pincode):''}</td>
      <td>${esc(s.to_company)}${s.to_country?' · '+esc(s.to_country):''}</td>
      <td>${s.box_count}</td><td class="amt">${fmt(s.chargeable_weight)}</td>
      <td class="amt">${fmt(s.rate)}</td><td class="amt">₹${fmt(s.amount)}</td>
      <td><span class="tag ${s.status==='Paid'?'mint':s.status==='Booked'?'gray':''}">${esc(s.status)}</span></td></tr>`).join('')
      ||'<tr><td colspan="10" style="text-align:center;color:#94a3b8;padding:30px">No shipments yet</td></tr>';
  }catch(e){}
}
async function openDrawer(id){
  const s=await api('/api/my/shipments/'+id);
  $('d_title').textContent=s.awb||'Shipment #'+s.id;
  $('d_body').innerHTML=`
    <dl class="kv">
      <dt>Carrier / Service</dt><dd>${esc(s.provider)}${s.service?' · '+esc(s.service):''}</dd>
      <dt>Date / Status</dt><dd>${esc(s.ship_date)} · ${esc(s.status)}</dd>
      <dt>From</dt><dd>${esc(s.from_address)}, ${esc(s.from_country)} ${esc(s.from_pincode)}</dd>
      <dt>To</dt><dd>${esc(s.to_company)}${s.to_contact?' (Attn: '+esc(s.to_contact)+')':''}<br>${esc(s.to_address)}, ${esc(s.to_country)}<br>${esc(s.to_phone)}</dd>
      <dt>Invoice</dt><dd>${esc(s.invoice_no)} · ${esc(s.invoice_date)} · ${esc(s.currency)} ${fmt(s.invoice_value)}</dd>
      <dt>Terms</dt><dd>${esc(s.incoterm||'—')} · ${esc(s.export_type||'—')}</dd>
      <dt>Items</dt><dd>${esc(s.items_desc||'—')}</dd>
      <dt>Boxes</dt><dd>${s.boxes.map(b=>`${b.count} × ${b.length}×${b.width}×${b.height} cm @ ${b.weight} kg`).join('<br>')||'—'}</dd>
      <dt>Weights</dt><dd class="mono">Actual ${fmt(s.actual_weight)} · Vol ${fmt(s.volumetric_weight)} · <b>Chg ${fmt(s.chargeable_weight)} kg</b></dd>
      <dt>Billing</dt><dd class="mono">₹${fmt(s.rate)}/kg → <b style="color:var(--blue)">₹${fmt(s.amount)}</b></dd>
    </dl>`;
  $('d_docs').innerHTML=s.documents.map(d=>`<div class="doc">
    <a href="/api/documents/${d.id}/download">📄 ${esc(d.original_name)}</a>
    <span style="color:#94a3b8;font-size:11px">${(d.size/1024).toFixed(0)} KB</span></div>`).join('')
    ||'<div style="color:#94a3b8;font-size:13px">No documents</div>';
  $('ov').classList.add('open');$('drawer').classList.add('open');
}
function closeDrawer(){$('ov').classList.remove('open');$('drawer').classList.remove('open');}
boot();
</script>
</body>
</html>
